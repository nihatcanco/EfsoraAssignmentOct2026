services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: briefbase
      POSTGRES_PASSWORD: briefbase
      POSTGRES_DB: briefbase
    ports:
      - "5433:5432"  # 5433 to avoid clashing with a local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefbase"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://briefbase:briefbase@db:5432/briefbase
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
